name: build-perf-hal

on:
  push:
    paths: ["ck8nb-vendor-services/perf-hal/**", ".github/workflows/build-perf-hal.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build aarch64 service
        working-directory: ck8nb-vendor-services/perf-hal
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK: $ANDROID_NDK_HOME"
          bash ./build.sh

      - name: Assemble ready-to-copy vendor tree
        run: |
          mkdir -p dist
          cp -r ck8nb-vendor-services/perf-hal/vendor dist/vendor
          mkdir -p dist/vendor/bin/hw
          cp ck8nb-vendor-services/perf-hal/out/vendor.oplus.hardware.performance-service dist/vendor/bin/hw/
          chmod 0755 dist/vendor/bin/hw/vendor.oplus.hardware.performance-service
          find dist -type f

      - uses: actions/upload-artifact@v4
        with:
          name: ck8nb-perf-hal
          path: dist/
