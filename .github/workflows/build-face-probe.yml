name: build-face-probe

on:
  push:
    paths: ["ck8nb-vendor-services/face-probe/**", ".github/workflows/build-face-probe.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build aarch64 probe
        working-directory: ck8nb-vendor-services/face-probe
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p out
          "$TC/aarch64-linux-android30-clang" -O2 -Wall face_probe.c -o out/face-probe -llog -ldl
          file out/face-probe
      - uses: actions/upload-artifact@v4
        with:
          name: ck8nb-face-probe
          path: ck8nb-vendor-services/face-probe/out/face-probe
