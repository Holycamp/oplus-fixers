name: build-charger

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build aarch64 service
        working-directory: ck8nb-vendor-services/charger
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK: $ANDROID_NDK_HOME"
          chmod +x build.sh
          ./build.sh release

      - name: Assemble ready-to-copy file
        run: |
          mkdir -p dist/vendor/bin/hw
          cp ck8nb-vendor-services/charger/out/vendor.oplus.hardware.charger-V12-service dist/vendor/bin/hw/
          chmod 0755 dist/vendor/bin/hw/vendor.oplus.hardware.charger-V12-service
          file dist/vendor/bin/hw/vendor.oplus.hardware.charger-V12-service
          find dist -type f

      - uses: actions/upload-artifact@v4
        with:
          name: ck8nb-charger-hal
          path: dist/
