name: build-charger

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build aarch64 charger service
        working-directory: ck8nb-vendor-services/charger
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK: $ANDROID_NDK_HOME"
          chmod +x build.sh
          ./build.sh

      - name: Assemble ready-to-copy vendor tree
        run: |
          S=ck8nb-vendor-services/charger
          mkdir -p dist/vendor/bin/hw
          if [ -d "$S/vendor" ]; then
            cp -r "$S/vendor/." dist/vendor/
          fi
          if [ -d "$S/out" ]; then
            cp "$S/out/"* dist/vendor/bin/hw/
          elif [ -f "$S/target/aarch64-linux-android/release/vendor-oplus-hardware-charger-service" ]; then
            cp "$S/target/aarch64-linux-android/release/vendor-oplus-hardware-charger-service" dist/vendor/bin/hw/
          fi
          chmod 0755 dist/vendor/bin/hw/*
          find dist -type f

      - uses: actions/upload-artifact@v4
        with:
          name: ck8nb-charger
          path: dist/
