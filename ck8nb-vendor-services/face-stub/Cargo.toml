[package]
name = "face-stub"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Stub android.hardware.biometrics.face.IFace AIDL HAL: registers one sensor so FaceService never gets an empty sensor list"

[[bin]]
name = "face-stub-service"
path = "src/main.rs"

[dependencies]
rsbinder = { version = "0.13.0", features = ["android_16"] }
async-trait = "0.1"
libc = "0.2"
log = "0.4"

[build-dependencies]
rsbinder-aidl = "=0.13.0"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
