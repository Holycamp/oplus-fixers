[package]
name = "touch-hal"
version = "0.8.0"
edition = "2021"
license = "Apache-2.0"
description = "vendor.oplus.hardware.touch.IOplusTouch V2 AIDL HAL for Transsion tran_touch (CK8nB): double-tap / screen-off gestures"

[[bin]]
name = "touch-hal-service"
path = "src/main.rs"

[dependencies]
rsbinder = { version = "0.13.0", features = ["android_16"] }
async-trait = "0.1"
libc = "0.2"
log = "0.4"

[build-dependencies]
rsbinder-aidl = "=0.13.0"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
